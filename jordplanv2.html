<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jordplan – klikbar prototype med kort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
<style>
:root{--ink:#0B2D3B;--quiet:#446470;--line:#CEDBE0;--ground:#F5F7FA;--green:#31815F;--green-d:#215C44;--tint:#DFF2EB}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.45}
a{color:var(--green)}a:hover{color:#215C44}
.hdr{position:relative;z-index:1100;background:#0B2D3B;color:#fff;display:flex;align-items:center;gap:16px;padding:0 32px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;cursor:pointer;font:inherit;text-align:left;padding:8px 0;min-width:0}
.brand img{width:36px;height:36px;flex-shrink:0}
.bt{display:block;font-size:20px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.bs{display:block;font-size:12px;color:#BECED4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navs{display:flex;gap:4px;margin-left:auto}
.nav{background:none;border:0;color:#DDE7EB;font:inherit;font-size:15px;font-weight:500;padding:10px 12px;min-height:44px;cursor:pointer;border-radius:6px;white-space:nowrap}
.nav:hover{color:#fff;background:#20404D}
.nav.on{color:#fff;font-weight:700;box-shadow:inset 0 -3px 0 #87BDA5}
.nav:focus-visible,.userbtn:focus-visible,.menubtn:focus-visible,.brand:focus-visible{outline:2px solid #87BDA5;outline-offset:2px}
.userbtn{display:flex;align-items:center;gap:8px;background:none;border:1px solid #446470;color:#fff;border-radius:999px;padding:6px 14px 6px 8px;min-height:44px;font:inherit;font-size:14px;cursor:pointer;flex-shrink:0;max-width:220px}
.userbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbtn:hover{background:#20404D}
.menubtn{display:none;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #446470;border-radius:8px;background:none;color:#fff;cursor:pointer;flex-shrink:0}
@media (max-width:1000px){
 .hdr{padding:0 16px;gap:8px}
 .menubtn{display:flex;order:3}
 .userbtn{margin-left:auto;order:2;padding:6px}
 .userbtn span{display:none}
 .navs{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:2px;background:#0B2D3B;padding:8px 16px 16px;border-top:1px solid #2E4F5C;box-shadow:0 8px 16px rgba(0,15,21,.25)}
 .hdr.open .navs{display:flex}
 .nav{text-align:left;width:100%;padding:12px}
 .nav.on{box-shadow:inset 3px 0 0 #87BDA5}
}
.proto{background:#F7E6BA;color:#0B2D3B;font-size:13px;padding:6px 32px;max-height:120px;overflow:hidden;animation:protoOut .6s ease 3s forwards}
@keyframes protoOut{to{opacity:0;max-height:0;padding-top:0;padding-bottom:0}}
@media (prefers-reduced-motion:reduce){.proto{animation-duration:.01s}}
.wrap{display:grid;grid-template-columns:minmax(320px,390px) minmax(0,1fr);gap:24px;padding:24px 32px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
.grey{background:#E6EDF0}
.h1{font-size:26px;font-weight:600;margin:0 0 12px;line-height:1.2}
.h2{font-size:20px;font-weight:600;margin:0 0 12px}
.lbl{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
.sm{font-size:13px;color:var(--quiet)}
.inp{width:100%;min-height:44px;border:1px solid #A6B9C0;border-radius:8px;padding:8px 12px;font:inherit;background:#fff;color:inherit}
.inp:focus{outline:2px solid var(--green);outline-offset:1px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--green);flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--green);background:var(--green);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--green-d);color:#fff}
.btn.ghost{background:#fff;color:var(--green)}
.btn.ghost:hover{background:var(--tint)}
.btn.dark{background:#0B2D3B;border-color:#0B2D3B}
.link{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;font:inherit;cursor:pointer;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:13px;margin-top:20px;padding-top:16px;border-top:1px solid #DDE7EB}
.lg{display:flex;align-items:center;gap:8px}
.sw,.lmk{position:relative;display:inline-block;width:16px;height:16px;flex-shrink:0}
.lmk{width:26px;height:26px;border-radius:50%;cursor:pointer}
.sw::before,.lmk::before{content:'';position:absolute;inset:0}
.lmk::before{inset:5px}
.t-gen::before{background:#7b2cbf;border-radius:50%;box-shadow:0 0 0 2px #fff}
.t-nyt::before{background:#C2273B;transform:rotate(45deg) scale(.82);box-shadow:0 0 0 2px #fff}
.t-res::before{background:#0B2D3B;transform:rotate(45deg) scale(.82);box-shadow:0 0 0 2px #fff}
.t-anl::before{background:#31815F;clip-path:polygon(50% 0,100% 100%,0 100%)}
.t-kar::before{background:#D19111;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.hollow{opacity:.5}
.lmk.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px #D19111;opacity:1}
.leaflet-div-icon.mkicon{background:none;border:0}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:680px;background:#E6EDF0}
#map{position:absolute;inset:0}
.mapmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--quiet)}
.originhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:600;background:#0B2D3B;color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;pointer-events:none}
.xbasebox{position:absolute;right:12px;top:12px;z-index:500;background:#fff;border:1px solid #A6B9C0;border-radius:8px;padding:10px 12px;font-size:13px;width:250px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.basebox label{display:flex;gap:8px;align-items:center;margin:4px 0;cursor:pointer}
.basebox .inp{min-height:36px;font-size:13px;padding:6px 8px}
.mapcount{position:absolute;left:12px;bottom:28px;z-index:500;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
.cattip{font-family:'DM Sans',system-ui,sans-serif;border:2px solid #7b2cbf;border-radius:8px;padding:6px 10px}
.res-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #DDE7EB;padding:14px 0;cursor:pointer;font:inherit;color:inherit}
.res-item:hover .rn{text-decoration:underline}
.rn{font-weight:600;color:var(--green);display:flex;align-items:center;gap:10px;font-size:16px;flex-wrap:wrap}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;color:#395966;margin-top:6px}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.b-booked{background:#FCCFD5;color:#791422}.b-afventer{background:#F7E6BA;color:#0B2D3B}.b-ledig{background:#E2F7E9;color:#084F21}
.b-doc{background:#E6EDF0;color:#395966;margin-right:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0B2D3B;color:#fff;padding:12px 20px;border-radius:8px;z-index:2000;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.overlay{position:fixed;inset:0;background:rgba(20,20,19,.45);display:flex;align-items:center;justify-content:center;z-index:1500;padding:16px}
.modal{background:#fff;border-radius:12px;padding:28px;width:min(480px,100%)}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet);margin:20px 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;border-bottom:1px solid #A6B9C0;padding:8px 6px}
.tbl td{border-bottom:1px solid #DDE7EB;padding:8px 6px;vertical-align:middle}
.page{max-width:1240px;margin:0 auto;padding:24px 32px}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:24px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--tint);border:1px solid #9FCCBA;border-radius:999px;padding:2px 2px 2px 12px;font-size:13px;margin:4px 6px 4px 0}
.x{width:32px;height:32px;border:0;border-radius:50%;background:transparent;cursor:pointer;font-size:16px;color:#395966}
.x:hover{background:#CAE5DA}
.err{color:#C2273B;font-size:13px;margin-top:6px}
.ok{color:var(--green);font-size:14px}
.note{font-size:13px;color:var(--quiet);margin:0}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--quiet)}.kv dd{margin:0}
.attest{background:#fff;border:1px solid #A6B9C0;border-radius:4px;padding:24px;margin-top:20px}
.qr{display:grid;grid-template-columns:repeat(9,8px);width:72px;height:72px}
.qr span{width:8px;height:8px}
.plot{position:relative;height:200px;background:#DDE7EB;border-radius:6px;overflow:hidden}
.delomr{position:absolute;background:#F3CE80;border:1px dashed #AC760E;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:10px}
.screen{background:#EDF2F5;border:1px solid #CEDBE0;border-radius:10px;padding:16px;margin-top:20px;display:flex;gap:12px}
.vh{position:absolute;left:-9999px}
.originbox{background:#EDF2F5;border:1px solid #CEDBE0;border-radius:8px;padding:4px 12px;margin-bottom:8px}
.foldbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 0;min-height:44px;font:inherit;font-weight:600;font-size:15px;color:#0B2D3B;cursor:pointer;text-align:left}
.foldbtn:focus-visible{outline:2px solid #31815F;outline-offset:2px;border-radius:6px}
.chev{width:8px;height:8px;border-right:2px solid #31815F;border-bottom:2px solid #31815F;transform:rotate(-45deg);transition:transform .15s;flex-shrink:0}
.chev.open{transform:rotate(45deg)}
.dist{margin-left:auto;font-size:13px;font-weight:600;color:#0B2D3B;background:#E6EDF0;border-radius:999px;padding:1px 8px}
.res-item.blocked{opacity:.55}
.res-item.blocked .rn{color:#446470}
.blk{display:block;font-size:13px;color:#791422;margin-top:4px}
.rinfo{font-size:13px;color:#0B2D3B;background:#FCF6E8;border:1px solid #F3CE80;border-radius:6px;padding:6px 10px}
div.blk{background:#FFEFF1;border:1px solid #FCCFD5;border-radius:6px;padding:6px 10px}
.lmk.blocked{filter:grayscale(1);opacity:.4}
.distlbl{display:inline-block;background:#fff;border:1px solid #A6B9C0;border-radius:999px;padding:0 6px;font-size:11px;font-weight:600;color:#0B2D3B;white-space:nowrap;line-height:16px}
.distlbl.off{color:#567480;border-style:dashed}
.pnr{display:grid;gap:4px;margin-bottom:16px}
.annhead{display:flex;justify-content:flex-end;margin-bottom:12px}
.fold{background:#fff;border:1px solid #CEDBE0;border-radius:10px;margin-bottom:24px}
.fold summary{cursor:pointer;padding:16px 20px;font-weight:600;font-size:16px;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:'';width:8px;height:8px;border-right:2px solid #31815F;border-bottom:2px solid #31815F;transform:rotate(-45deg);transition:transform .15s;flex-shrink:0}
.fold[open] summary::before{transform:rotate(45deg)}
.fold summary:focus-visible{outline:2px solid #31815F;outline-offset:-2px;border-radius:10px}
.foldbody{padding:0 20px 20px 38px;font-size:15px}
.leaf{list-style:none;margin:0;padding:0;display:grid;gap:10px;max-width:820px}
.leaf li{position:relative;padding-left:24px}
.leaf li::before{content:'';position:absolute;left:0;top:5px;width:12px;height:12px;background:#31815F;border-radius:0 70% 0 70%}
.guide{margin:0 0 12px;padding-left:20px;display:grid;gap:8px;font-size:15px}
.ndrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #DDE7EB}
.fs{border:0;padding:0;margin:14px 0 0;min-width:0}
.fs .lbl{margin-top:0;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid #A6B9C0;border-radius:999px;font-size:14px;background:#fff}
.chip input:checked+span{background:#DFF2EB;border-color:#31815F;color:#144733;font-weight:600}
.chip input:focus-visible+span{outline:2px solid #31815F;outline-offset:2px}
.tip{position:relative;display:inline-flex}
.tipbtn{width:20px;height:20px;border-radius:50%;border:1px solid #446470;background:#fff;color:#0B2D3B;font:600 12px/1 'DM Sans',system-ui,sans-serif;font-style:italic;cursor:help;padding:0;display:inline-flex;align-items:center;justify-content:center}
.tiptxt{position:absolute;left:-60px;bottom:calc(100% + 8px);width:240px;background:#0B2D3B;color:#fff;font-size:13px;font-weight:400;line-height:1.4;padding:8px 10px;border-radius:6px;visibility:hidden;opacity:0;transition:opacity .15s;z-index:600;pointer-events:none}
.tip:hover .tiptxt,.tipbtn:focus+.tiptxt{visibility:visible;opacity:1}
.numbtn{background:none;border:0;border-bottom:1px dashed #31815F;color:#31815F;font:inherit;font-weight:600;padding:0 2px;cursor:pointer}
.numinp{width:110px;min-height:32px;border:1px solid #31815F;border-radius:6px;padding:2px 6px;font:inherit}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
[hidden]{display:none!important}
@media (max-width:900px){.wrap,.grid3{grid-template-columns:1fr}.proto{padding:6px 16px}.wrap,.page{padding:16px}.mapwrap{min-height:460px}}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function dk(iso){if(!iso)return '';var p=iso.split('-');return (+p[2])+'-'+(+p[1])+'-'+p[0];}
function fmtT(t){return t==null?'Ingen grænse':t.toLocaleString('da-DK')+' t';}
function total(m){var n=0;for(var i=0;i<m.lines.length;i++){if(m.lines[i].t==null)return null;n+=m.lines[i].t;}return n;}
function klasser(m){var ks=[];m.lines.forEach(function(l){if(ks.indexOf(l.k)<0)ks.push(l.k);});ks.sort();return 'Klasse '+ks.join(', ');}
function hasK(m,k){return m.lines.some(function(l){return l.k===k;});}
function byId(id){return S.mods.find(function(m){return m.id===+id;});}
function match(m){
  if(m.restrict&&m.restrict.cvr)return false;
  if(S.res==='0'&&!hasK(m,0))return false;
  if(S.res==='1'&&!hasK(m,1))return false;
  if(S.res==='23'&&!hasK(m,2)&&!hasK(m,3))return false;
  if(S.type!=='alle'&&m.type!==S.type)return false;
  if(S.from&&m.end<S.from)return false;
  if(S.to&&m.start>S.to)return false;
  var t=total(m);
  if(S.big&&!(t==null||t>S.minT))return false;
  if(S.jt.length&&!S.jt.some(function(j){return m.jt.indexOf(j)>=0;}))return false;
  if(S.sort&&!m.yd.sortering)return false;
  if(S.kalk&&!m.yd.kalk)return false;
  if(S.svc.length&&!S.svc.every(function(k){return m.yd[k];}))return false;
  return true;
}
function badgeOf(m){return m.status==='booked'?'Booked':m.status==='afventer'?'Afventer tilladelse':'Ledig';}
function isFull(m){return SVC.every(function(x){return m.yd[x[0]];});}

function makeBase(){

var B={minLat:55.775,maxLat:55.925,minLng:12.235,maxLng:12.525};
var TOWNS=[['Lynge',55.839,12.283],['Lillerød',55.875,12.345],['Farum',55.808,12.36],['Birkerød',55.847,12.428],['Holte',55.818,12.472],['Kokkedal',55.906,12.47],['Værløse',55.782,12.37],['Ganløse',55.792,12.265]];
function xy(lat,lng){return {x:(lng-B.minLng)/(B.maxLng-B.minLng)*100,y:(B.maxLat-lat)/(B.maxLat-B.minLat)*100};}
var sketch=false;
var ORIGIN_SVG='<svg width="28" height="36" viewBox="0 0 28 36" aria-hidden="true"><path d="M14 35C14 35 26 21 26 13A12 12 0 0 0 2 13C2 21 14 35 14 35Z" fill="#0B2D3B" stroke="#fff" stroke-width="2"/><circle cx="14" cy="13" r="4.5" fill="#fff"/></svg>';

function sketchMap(shown,cat,isDet,sel){
  var h='<div style="position:absolute;inset:0;background:#E6EDF0"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">';
  if(cat){var c=xy(cat.lat,cat.lng);cat.members.map(byId).filter(Boolean).forEach(function(m){var p=xy(m.lat,m.lng);h+='<line x1="'+c.x+'" y1="'+c.y+'" x2="'+p.x+'" y2="'+p.y+'" stroke="#7b2cbf" stroke-width="3" vector-effect="non-scaling-stroke"/>';});}
  h+='</svg>';
  TOWNS.forEach(function(t){var p=xy(t[1],t[2]);h+='<span style="position:absolute;left:'+p.x+'%;top:'+p.y+'%;transform:translate(-50%,-50%);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#567480;pointer-events:none">'+t[0]+'</span>';});
  if(cat){var q=xy(cat.lat,cat.lng);h+='<div style="position:absolute;left:'+q.x+'%;top:'+q.y+'%;transform:translate(-17px,-15px);display:flex;gap:8px;align-items:flex-start;pointer-events:none"><svg width="34" height="30" viewBox="0 0 24 21"><path d="M1 3a2 2 0 0 1 2-2h6l2 3h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#7b2cbf"/></svg><div class="cattip" style="background:#fff;font-size:13px"><b>'+esc(cat.name)+'</b><br>'+dk(cat.start)+' – '+dk(cat.end)+'</div></div>';}
  shown.forEach(function(m){var p=xy(m.lat,m.lng),tt=m.name+(restrictTxt(m)?' – '+restrictTxt(m):'');h+='<button class="lmk t-'+m.type+(m.status!=='ledig'?' hollow':'')+(blocked(m)?' blocked':'')+(isDet&&m.id===sel.id?' sel':'')+'" style="position:absolute;left:'+p.x+'%;top:'+p.y+'%;transform:translate(-50%,-50%);border:0;padding:0;background:transparent" data-a="open" data-v="'+m.id+'" title="'+esc(tt)+'" aria-label="'+esc(tt)+'"></button>'+(S.origin?'<span class="distlbl'+(blocked(m)?' off':'')+'" style="position:absolute;left:calc('+p.x+'% + 14px);top:'+p.y+'%;transform:translateY(-50%);pointer-events:none">'+kmTxt(m)+'</span>':'');});
  if(S.origin){var po=xy(S.origin.lat,S.origin.lng);h+='<span style="position:absolute;left:'+po.x+'%;top:'+po.y+'%;transform:translate(-14px,-34px);pointer-events:none" title="Oprindelse">'+ORIGIN_SVG+'</span>';}
  h+='<div class="sm" style="position:absolute;right:12px;top:12px;background:#fff;border:1px solid #CEDBE0;border-radius:8px;padding:6px 10px;max-width:260px">Skitsekort. Det rigtige kort (OpenStreetMap) vises i den downloadede HTML-fil.</div></div>';

function initMap(){

function updateMap(fit){
  if(!map&&!sketch)return;
  var list=S.mods.filter(match), isDet=S.screen==='detalje', sel=byId(S.sel), cat=activeCat();
  var shown=list.slice();
  function add(m){if(m&&shown.indexOf(m)<0)shown.push(m);}
  if(isDet)add(sel);
  if(cat)cat.members.forEach(function(id){add(byId(id));});
  if(sketch){sketchMap(shown,cat,isDet,sel);document.getElementById('mapCount').textContent=shown.length+' modtagesteder vist';return;}
  layer.clearLayers();
  if(cat){
    cat.members.map(byId).filter(Boolean).forEach(function(m){L.polyline([[cat.lat,cat.lng],[m.lat,m.lng]],{color:'#7b2cbf',weight:3,opacity:.85}).addTo(layer);});
    L.marker([cat.lat,cat.lng],{icon:L.divIcon({className:'mkicon',html:'<svg width="34" height="30" viewBox="0 0 24 21"><path d="M1 3a2 2 0 0 1 2-2h6l2 3h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#7b2cbf" stroke="#fff" stroke-width="1"/></svg>',iconSize:[34,30],iconAnchor:[17,15]}),keyboard:false})
      .bindTooltip('<b>'+esc(cat.name)+'</b><br>'+dk(cat.start)+' – '+dk(cat.end),{permanent:true,direction:'right',offset:[18,0],className:'cattip'}).addTo(layer);
  }
  shown.forEach(function(m){
    var mk=L.marker([m.lat,m.lng],{icon:icon(m,isDet&&m.id===sel.id),title:m.name,alt:m.name,riseOnHover:true});
    mk.bindTooltip('<b>'+esc(m.name)+'</b><br>'+klasser(m)+(restrictTxt(m)?'<br><span style="color:#791422">'+esc(restrictTxt(m))+'</span>':''),{direction:'top',offset:[0,-12]});
    if(S.origin)L.marker([m.lat,m.lng],{icon:L.divIcon({className:'mkicon',html:'<span class="distlbl'+(blocked(m)?' off':'')+'">'+kmTxt(m)+'</span>',iconSize:[60,18],iconAnchor:[-14,9]}),interactive:false,keyboard:false}).addTo(layer);
    mk.on('click',function(){act.open(m.id);});
    mk.addTo(layer);
  });
  if(S.origin){L.marker([S.origin.lat,S.origin.lng],{icon:L.divIcon({className:'mkicon',html:ORIGIN_SVG,iconSize:[28,36],iconAnchor:[14,34]}),keyboard:false}).bindTooltip('Oprindelse: '+esc(S.origin.name),{direction:'top',offset:[0,-30]}).addTo(layer);}
  document.getElementById('originHint').hidden=!S.pickOrigin;
  document.getElementById('map').style.cursor=S.pickOrigin?'crosshair':'';
  document.getElementById('mapCount').textContent=shown.length+' modtagesteder vist';
  if(isDet&&lastFocus!==sel.id){lastFocus=sel.id;map.flyTo([sel.lat,sel.lng],Math.max(map.getZoom(),13),{duration:.6});}
  else if(fit&&shown.length){lastFocus=null;var b=L.latLngBounds(shown.map(function(m){return [m.lat,m.lng];}));if(cat)b.extend([cat.lat,cat.lng]);if(S.origin)b.extend([S.origin.lat,S.origin.lng]);map.fitBounds(b,{padding:[60,60],maxZoom:14});}
}
